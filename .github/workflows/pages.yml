name: Deploy public dashboard to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - inputs/four_strategy_daily_signals.xlsx
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare public site
        run: |
          mkdir -p _site/inputs
          cp index.html _site/index.html
          cp inputs/four_strategy_daily_signals.xlsx _site/inputs/four_strategy_daily_signals.xlsx
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
